<mat-toolbar color="primary">
  <span>Todo List</span>
</mat-toolbar>

<main class="container">
  <app-add-todo />
  @if (todoService.status() === 'loading') {
    <p class="status-message loading">Loading todos…</p>
  } @else if (todoService.status() === 'error') {
    <p class="status-message error">{{ todoService.error() }}</p>
  } @else {
    <app-todo-list />
  }
</main>
